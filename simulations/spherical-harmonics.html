<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>구면조화함수 Yₗᵐ(θ,φ)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1020; --panel:#171a35; --panel2:#1e2245;
    --line:#2b3168; --txt:#e6e8ff; --txt2:#9aa0d8;
    --accent:#7c8cff; --pos:#f06595; --neg:#5c7cfa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    color:var(--txt);font-family:'IBM Plex Sans KR',system-ui,sans-serif;}
  #app{display:flex;height:100%;width:100%;}
  #stage{flex:1 1 auto;position:relative;min-width:0;}
  canvas{display:block;width:100%;height:100%;touch-action:none;}
  #hud{position:absolute;top:14px;left:16px;pointer-events:none;
    font-family:'IBM Plex Mono',monospace;}
  #hud .title{font-family:'IBM Plex Sans KR';font-size:13px;color:var(--txt2);letter-spacing:.5px;}
  #hud .yf{font-size:30px;font-weight:500;margin-top:2px;line-height:1.1;}
  #hud .yf sub,#hud .yf sup{font-size:.55em;}
  #hud .orb{font-size:15px;color:var(--accent);margin-top:4px;height:18px;}
  #panel{flex:0 0 300px;background:var(--panel);border-left:1px solid var(--line);
    padding:20px 20px 24px;overflow-y:auto;}
  h1{font-size:15px;font-weight:600;margin:0 0 2px;letter-spacing:.3px;}
  .sub{font-size:11.5px;color:var(--txt2);margin:0 0 18px;line-height:1.5;}
  .grp{margin-bottom:20px;}
  .lbl{display:flex;justify-content:space-between;align-items:baseline;
    font-size:12.5px;color:var(--txt2);margin-bottom:8px;}
  .lbl b{color:var(--txt);font-family:'IBM Plex Mono';font-size:15px;font-weight:500;}
  input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;
    background:var(--panel2);outline:none;margin:2px 0;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
    border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--panel);
    box-shadow:0 0 0 1px var(--accent);}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;
    background:var(--accent);cursor:pointer;border:3px solid var(--panel);}
  .ticks{display:flex;justify-content:space-between;font-size:10px;color:#5a5f96;
    font-family:'IBM Plex Mono';margin-top:2px;}
  .toggle{display:flex;background:var(--panel2);border-radius:9px;padding:3px;gap:3px;}
  .toggle button{flex:1;border:none;background:transparent;color:var(--txt2);
    font-family:'IBM Plex Sans KR';font-size:12.5px;padding:9px 4px;border-radius:7px;
    cursor:pointer;transition:.15s;}
  .toggle button.on{background:var(--accent);color:#0f1020;font-weight:600;}
  .row{display:flex;gap:8px;}
  .btn{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    font-family:'IBM Plex Sans KR';font-size:12.5px;padding:10px;border-radius:8px;cursor:pointer;}
  .btn:active{background:var(--line);}
  .btn.on{border-color:var(--accent);color:var(--accent);}
  .legend{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--txt2);
    margin-top:6px;font-family:'IBM Plex Mono';}
  .sw{width:14px;height:14px;border-radius:3px;}
  .info{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:13px 14px;font-size:12px;line-height:1.7;color:var(--txt2);}
  .info b{color:var(--txt);font-family:'IBM Plex Mono';font-weight:500;}
  .info .k{color:var(--accent);}
  .hint{font-size:11px;color:#5a5f96;margin-top:10px;line-height:1.5;}
  #phasebar{width:100%;height:12px;border-radius:6px;margin-top:6px;
    background:linear-gradient(90deg,
      hsl(0,70%,60%),hsl(60,70%,60%),hsl(120,70%,60%),
      hsl(180,70%,60%),hsl(240,70%,60%),hsl(300,70%,60%),hsl(360,70%,60%));}
  @media (max-width:820px){
    #app{flex-direction:column;}
    #panel{flex:0 0 auto;max-height:46%;border-left:none;border-top:1px solid var(--line);}
    #hud .yf{font-size:24px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="title">구면조화함수 · SPHERICAL HARMONICS</div>
      <div class="yf" id="yf"></div>
      <div class="orb" id="orb"></div>
    </div>
  </div>

  <div id="panel">
    <h1>구면조화함수 Yₗᵐ(θ,φ)</h1>
    <p class="sub">방향마다 반지름 <b style="font-family:'IBM Plex Mono'">r = |Y|</b> 로 그린 각(角) 부분 표면. 실제 오비탈은 여기에 동경 부분 R(r)을 곱해야 함.</p>

    <div class="grp">
      <div class="lbl"><span>각운동량 양자수 <span style="font-family:'IBM Plex Mono'">l</span></span><b id="lval">2</b></div>
      <input type="range" id="lsl" min="0" max="6" step="1" value="2">
      <div class="ticks"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div>
    </div>

    <div class="grp">
      <div class="lbl"><span>자기 양자수 <span style="font-family:'IBM Plex Mono'">m</span></span><b id="mval">0</b></div>
      <input type="range" id="msl" min="-2" max="2" step="1" value="0">
      <div class="ticks" id="mticks"></div>
    </div>

    <div class="grp">
      <div class="lbl"><span>표현 방식</span></div>
      <div class="toggle">
        <button id="tReal" class="on">실수형 (오비탈)</button>
        <button id="tCplx">복소형 (Lᵤ 고유)</button>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="grp">
      <div class="row">
        <button class="btn on" id="bRot">⟳ 자동회전</button>
        <button class="btn" id="bReset">시점 초기화</button>
      </div>
    </div>

    <div class="info" id="info"></div>
    <p class="hint">드래그(터치)로 회전 · 두 손가락/휠로 확대. 표면은 <b style="font-family:'IBM Plex Mono';color:#e6e8ff">|Y|</b> 이며 색은 부호(실수형) 또는 위상 arg Y(복소형)입니다.</p>
  </div>
</div>

<script>
"use strict";
(function(){
const NT=56, NP=96;          // theta, phi 분할 수
const TAU=Math.PI*2;
let l=2, m=0, mode='real', autoRotate=true;
let angleX=-0.45, angleY=0.7, zoom=1;
let needsRender=true;

// ---------- 수학부 ----------
function factorial(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r;}
function norm(l,m){return Math.sqrt((2*l+1)/(4*Math.PI)*factorial(l-m)/factorial(l+m));}
// 버금 르장드르 (Numerical Recipes, Condon-Shortley 포함)
function plm(l,m,x){
  let pmm=1;
  if(m>0){
    const somx2=Math.sqrt(Math.max(0,(1-x)*(1+x)));
    let fact=1;
    for(let i=1;i<=m;i++){pmm*=-fact*somx2;fact+=2;}
  }
  if(l===m)return pmm;
  let pmmp1=x*(2*m+1)*pmm;
  if(l===m+1)return pmmp1;
  let pll=0;
  for(let ll=m+2;ll<=l;ll++){
    pll=((2*ll-1)*x*pmmp1-(ll+m-1)*pmm)/(ll-m);
    pmm=pmmp1;pmmp1=pll;
  }
  return pll;
}

// ---------- 기하 생성 ----------
let VX,VY,VZ,VC;   // 정점 좌표 + 색인자(부호 또는 위상)
let faces;         // 4정점 인덱스
let maxR=1;
function buildGeometry(){
  const nv=(NT+1)*(NP+1);
  VX=new Float32Array(nv); VY=new Float32Array(nv);
  VZ=new Float32Array(nv); VC=new Float32Array(nv);
  const am=Math.abs(m), N=norm(l,am), S2=Math.SQRT2;
  maxR=1e-6; let idx=0;
  for(let it=0;it<=NT;it++){
    const th=Math.PI*it/NT, ct=Math.cos(th), st=Math.sin(th);
    const P=plm(l,am,ct);          // phi 무관
    for(let ip=0;ip<=NP;ip++){
      const ph=TAU*ip/NP;
      let r, c;
      if(mode==='real'){
        let y;
        if(m>0)      y=S2*N*P*Math.cos(am*ph);
        else if(m<0) y=S2*N*P*Math.sin(am*ph);
        else         y=N*P;
        r=Math.abs(y); c=y>=0?1:-1;               // 부호
      }else{
        const mag=N*P;                            // |Y| (phi 무관)
        r=Math.abs(mag);
        c=m*ph+(mag<0?Math.PI:0);                 // 위상 arg Y
      }
      const x=r*st*Math.cos(ph), yv=r*st*Math.sin(ph), z=r*ct;
      VX[idx]=x; VY[idx]=yv; VZ[idx]=z; VC[idx]=c;
      if(r>maxR)maxR=r;
      idx++;
    }
  }
  faces=[];
  const w=NP+1;
  for(let it=0;it<NT;it++)for(let ip=0;ip<NP;ip++){
    const a=it*w+ip, b=a+1, d=a+w, e=d+1;
    faces.push(a,b,e,d);
  }
  needsRender=true;
}

// ---------- 색 ----------
function hsl(h,s,li){
  h=((h%360)+360)%360; s/=100; li/=100;
  const c=(1-Math.abs(2*li-1))*s, x=c*(1-Math.abs((h/60)%2-1)), mm=li-c/2;
  let r,g,b;
  if(h<60){r=c;g=x;b=0;}else if(h<120){r=x;g=c;b=0;}
  else if(h<180){r=0;g=c;b=x;}else if(h<240){r=0;g=x;b=c;}
  else if(h<300){r=x;g=0;b=c;}else{r=c;g=0;b=x;}
  return [(r+mm)*255,(g+mm)*255,(b+mm)*255];
}
const POS=[240,101,149], NEG=[92,124,250];

// ---------- 렌더 ----------
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const r=cv.getBoundingClientRect();
  W=r.width; H=r.height;
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  needsRender=true;
}
window.addEventListener('resize',resize);

const RX=new Float32Array(1),RY=new Float32Array(1); // placeholders
let rx,ry,rz,sx,sy;
function render(){
  const nv=VX.length;
  if(!rx||rx.length!==nv){
    rx=new Float32Array(nv);ry=new Float32Array(nv);
    rz=new Float32Array(nv);sx=new Float32Array(nv);sy=new Float32Array(nv);
  }
  const cy=Math.cos(angleY),sy_=Math.sin(angleY);
  const cx=Math.cos(angleX),sx_=Math.sin(angleX);
  const scale=Math.min(W,H)*0.40*zoom/maxR;
  const ox=W/2, oy=H/2;
  for(let i=0;i<nv;i++){
    const x=VX[i],y=VY[i],z=VZ[i];
    const x1=x*cy+z*sy_, z1=-x*sy_+z*cy, y1=y;
    const y2=y1*cx-z1*sx_, z2=y1*sx_+z1*cx;
    rx[i]=x1; ry[i]=y2; rz[i]=z2;
    sx[i]=ox+x1*scale; sy[i]=oy-y2*scale;
  }
  // 면 정렬 (painter)
  const nf=faces.length/4;
  const order=new Array(nf), depth=new Float32Array(nf);
  for(let f=0;f<nf;f++){
    const k=f*4;
    depth[f]=(rz[faces[k]]+rz[faces[k+1]]+rz[faces[k+2]]+rz[faces[k+3]])*0.25;
    order[f]=f;
  }
  order.sort((a,b)=>depth[a]-depth[b]);
  // 조명 (뷰 공간 고정광)
  const Lx=0.35,Ly=0.45,Lz=0.82;
  ctx.clearRect(0,0,W,H);
  for(let o=0;o<nf;o++){
    const f=order[o], k=f*4;
    const i0=faces[k],i1=faces[k+1],i2=faces[k+2],i3=faces[k+3];
    // 법선 (회전 좌표)
    const ux=rx[i1]-rx[i0], uy=ry[i1]-ry[i0], uz=rz[i1]-rz[i0];
    const vx=rx[i3]-rx[i0], vy=ry[i3]-ry[i0], vz=rz[i3]-rz[i0];
    let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
    const nl=Math.hypot(nx,ny,nz)||1;
    const dot=Math.abs((nx*Lx+ny*Ly+nz*Lz)/nl);   // 양면 조명
    const sh=0.32+0.68*dot;
    let col;
    if(mode==='real'){
      const base=VC[i0]>0?POS:NEG;
      col='rgb('+(base[0]*sh|0)+','+(base[1]*sh|0)+','+(base[2]*sh|0)+')';
    }else{
      const rgb=hsl(VC[i0]*180/Math.PI,68,62);
      col='rgb('+(rgb[0]*sh|0)+','+(rgb[1]*sh|0)+','+(rgb[2]*sh|0)+')';
    }
    ctx.beginPath();
    ctx.moveTo(sx[i0],sy[i0]);
    ctx.lineTo(sx[i1],sy[i1]);
    ctx.lineTo(sx[i2],sy[i2]);
    ctx.lineTo(sx[i3],sy[i3]);
    ctx.closePath();
    ctx.fillStyle=col; ctx.strokeStyle=col; ctx.lineWidth=0.6;
    ctx.fill(); ctx.stroke();
  }
}

function loop(){
  if(autoRotate){angleY+=0.006;needsRender=true;}
  if(needsRender){render();needsRender=false;}
  requestAnimationFrame(loop);
}

// ---------- UI ----------
const $=id=>document.getElementById(id);
const ORB={
  0:{0:'s'},
  1:{'-1':'p_y', 0:'p_z', 1:'p_x'},
  2:{'-2':'d_xy','-1':'d_yz',0:'d_z²',1:'d_xz',2:'d_x²−y²'}
};
function supsub(l,m){
  return 'Y<sub>'+l+'</sub><sup>'+(m>0?'+'+m:m)+'</sup>';
}
function updateInfo(){
  const am=Math.abs(m);
  $('yf').innerHTML=supsub(l,m)+'(θ,φ)';
  // 오비탈 이름
  let name='';
  if(mode==='real'&&ORB[l]&&ORB[l][m]!==undefined) name=ORB[l][m]+' 오비탈 각부분';
  $('orb').textContent=name;
  $('lval').textContent=l;
  $('mval').textContent=m;
  // 정보 박스
  const cones=l-am;
  let html;
  if(mode==='real'){
    html='<div>표면 <b>r = |Y|</b>, 색 = 부호</div>'+
      '<div>각도 노드 총 <b class="k">'+l+'</b>개</div>'+
      '<div>· 방위각 노드면 |m| = <b>'+am+'</b></div>'+
      '<div>· 극 노드원뿔 l−|m| = <b>'+cones+'</b></div>';
  }else{
    html='<div>복소 <b>Y = N·Pₗᵐ·e<sup>imφ</sup></b></div>'+
      '<div>|Y|²이 φ에 무관 → <b class="k">z축 대칭</b></div>'+
      '<div>극 노드원뿔 l−|m| = <b>'+cones+'</b></div>'+
      '<div>색 = 위상 arg Y (∝ mφ)</div>';
  }
  $('info').innerHTML=html;
  // 범례
  const lg=$('legend');
  if(mode==='real'){
    lg.innerHTML='<span class="sw" style="background:rgb(240,101,149)"></span>Y&gt;0'+
      '<span class="sw" style="background:rgb(92,124,250);margin-left:10px"></span>Y&lt;0';
  }else{
    lg.innerHTML='<div style="width:100%"><span>위상 arg Y</span><div id="phasebar"></div></div>';
  }
}
function rebuildMTicks(){
  const t=$('mticks'); t.innerHTML='';
  const s1=document.createElement('span'); s1.textContent='−'+l;
  const s2=document.createElement('span'); s2.textContent='0';
  const s3=document.createElement('span'); s3.textContent='+'+l;
  t.append(s1,s2,s3);
}
function setL(v){
  l=v;
  const ms=$('msl'); ms.min=-l; ms.max=l;
  if(m>l)m=l; if(m<-l)m=-l; ms.value=m;
  rebuildMTicks();
  buildGeometry(); updateInfo();
}
function setM(v){ m=v; buildGeometry(); updateInfo(); }

$('lsl').addEventListener('input',e=>setL(+e.target.value));
$('msl').addEventListener('input',e=>setM(+e.target.value));
function setMode(md){
  mode=md;
  $('tReal').classList.toggle('on',md==='real');
  $('tCplx').classList.toggle('on',md==='complex');
  buildGeometry(); updateInfo();
}
$('tReal').addEventListener('click',()=>setMode('real'));
$('tCplx').addEventListener('click',()=>setMode('complex'));
$('bRot').addEventListener('click',e=>{
  autoRotate=!autoRotate; e.target.classList.toggle('on',autoRotate);
});
$('bReset').addEventListener('click',()=>{
  angleX=-0.45; angleY=0.7; zoom=1; needsRender=true;
});

// 포인터 회전
let drag=false,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  angleY+=(e.clientX-lx)*0.008;
  angleX+=(e.clientY-ly)*0.008;
  angleX=Math.max(-1.5,Math.min(1.5,angleX));
  lx=e.clientX; ly=e.clientY; needsRender=true;
});
cv.addEventListener('pointerup',()=>drag=false);
cv.addEventListener('pointercancel',()=>drag=false);
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  zoom*=(e.deltaY<0?1.08:0.925);
  zoom=Math.max(0.4,Math.min(3,zoom)); needsRender=true;
},{passive:false});

// 초기화
resize(); rebuildMTicks(); buildGeometry(); updateInfo();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
